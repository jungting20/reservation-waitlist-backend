name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://reservation:reservation@localhost:5432/reservation_test
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: reservation_test
          POSTGRES_USER: reservation
          POSTGRES_PASSWORD: reservation
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U reservation -d reservation_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm db:migrate
      - run: pnpm test:e2e
      - run: pnpm build
